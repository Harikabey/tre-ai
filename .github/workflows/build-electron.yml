name: Build and release Electron app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            asset: Tre-Setup.exe
          - platform: macos
            os: macos-latest
            asset: Tre.dmg
          - platform: linux
            os: ubuntu-latest
            asset: Tre.AppImage
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package Electron app
        run: npm run electron:build

      - name: Upload platform build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          merge-multiple: true
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/Tre-Setup.exe
            release-assets/Tre.dmg
            release-assets/Tre.AppImage
